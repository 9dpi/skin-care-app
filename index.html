<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gương Thần Soi Da ✨ (AI)</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Pacifico&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #ff9a9e;
            var(--secondary): #fecfef;
            var(--accent): #ff6b6b;
            var(--bg: #fff5f8);
            --card-bg: #ffffff;
            var(--text-main): #664449;
            var(--text-light): #99888a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(#ffe4e6 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            padding: 15px;
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(255, 182, 193, 0.2);
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
        }

        .logo {
            font-family: 'Pacifico', cursive;
            font-size: 1.5rem;
            color: var(--accent);
            text-shadow: 2px 2px 0px #fff;
        }

        main {
            margin-top: 80px;
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .scanner-wrapper {
            position: relative;
            padding: 10px;
            background: white;
            border-radius: 40px;
            box-shadow: 0 10px 30px rgba(255, 154, 158, 0.3);
            margin-bottom: 20px;
            width: 100%;
        }

        .scanner-container {
            width: 100%;
            height: 350px;
            background: #ffe4e6;
            border-radius: 30px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #camera-feed {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            border-radius: 30px;
        }

        .camera-placeholder {
            font-size: 1.2rem;
            color: var(--primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            position: absolute;
            z-index: 1;
            text-align: center;
            padding: 20px;
        }

        .scanner-line {
            position: absolute;
            width: 100%;
            height: 5px;
            background: #fff;
            box-shadow: 0 0 20px var(--accent);
            top: 0;
            left: 0;
            animation: scanAnim 3s ease-in-out infinite;
            display: none;
            z-index: 10;
        }

        @keyframes scanAnim {
            0% {
                top: 0%;
                opacity: 0;
            }

            50% {
                opacity: 1;
            }

            100% {
                top: 100%;
                opacity: 0;
            }
        }

        /* PROGRESS BAR STYLE */
        .progress-wrapper {
            width: 100%;
            margin-top: -30px;
            z-index: 20;
            position: relative;
            padding: 0 20px;
            display: none;
        }

        .progress-track {
            background: rgba(255, 255, 255, 0.5);
            width: 100%;
            height: 12px;
            border-radius: 10px;
            overflow: hidden;
            backdrop-filter: blur(5px);
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff9a9e, #ff6b6b);
            border-radius: 10px;
            transition: width 0.1s linear;
        }

        .progress-text {
            text-align: center;
            color: white;
            font-weight: 800;
            font-size: 1rem;
            margin-top: 5px;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
        }

        .status-text {
            font-size: 1.1rem;
            color: var(--accent);
            font-weight: 700;
            min-height: 28px;
            text-align: center;
            margin-bottom: 20px;
            background: white;
            padding: 8px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            margin-top: 15px;
        }

        /* BUTTON NÂNG CẤP */
        .action-btn {
            padding: 18px 40px;
            border-radius: 60px;
            background: linear-gradient(135deg, #ff9a9e 0%, #ff6b6b 100%);
            border: 4px solid white;
            color: white;
            font-weight: 900;
            font-size: 1.3rem;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(255, 107, 107, 0.5);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 90%;
            text-transform: uppercase;
            letter-spacing: 1px;
            animation: pulse-glow 2s infinite;
        }

        .action-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 35px rgba(255, 107, 107, 0.7);
        }

        .action-btn:active {
            transform: scale(0.95);
        }

        @keyframes pulse-glow {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 107, 107, 0.7);
            }

            70% {
                box-shadow: 0 0 0 15px rgba(255, 107, 107, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(255, 107, 107, 0);
            }
        }

        #results-area {
            display: none;
            width: 100%;
            margin-top: 10px;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .section-title {
            font-size: 1.2rem;
            font-weight: 800;
            margin-bottom: 15px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .score-card {
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 20px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            border: 2px solid #fff;
        }

        .score-info h4 {
            color: var(--text-main);
            font-size: 1rem;
        }

        .score-info small {
            color: var(--text-light);
        }

        .score-circle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: conic-gradient(var(--accent) var(--p), #ffe4e6 0);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: inset 0 0 0 4px white;
        }

        .score-circle::after {
            content: attr(data-val);
            position: absolute;
            color: var(--accent);
            font-weight: 800;
            font-size: 0.8rem;
            background: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .recommendation {
            background: #fff;
            border: 2px dashed var(--primary);
            padding: 20px;
            border-radius: 25px;
            margin-top: 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .rec-tag {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            background: var(--primary);
            color: white;
            padding: 5px 15px;
            font-size: 0.8rem;
            font-weight: 700;
            border-bottom-left-radius: 10px;
            border-bottom-right-radius: 10px;
        }

        .buy-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 30px;
            background: var(--accent);
            color: white;
            text-decoration: none;
            border-radius: 15px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(255, 107, 107, 0.4);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }

            100% {
                transform: scale(1);
            }
        }

        .debug-info {
            font-size: 0.7rem;
            color: #aaa;
            text-align: center;
            margin-top: 5px;
            font-family: monospace;
            display: none;
        }

        /* Product Image Style */
        .rec-img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 10px;
            border: 2px solid #eee;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">✨ Magic Mirror AI ✨</div>
    </header>

    <main>
        <div class="scanner-wrapper">
            <div class="scanner-container">
                <div class="camera-placeholder" id="cam-placeholder">
                    📷 <span>Đang khởi động Camera...<br><small>(Hãy cho phép truy cập nhé)</small></span>
                </div>
                <video id="camera-feed" autoplay playsinline muted></video>
                <canvas id="scan-canvas" style="display:none;"></canvas> <!-- Hidden Canvas for AI -->
                <div id="scan-line" class="scanner-line"></div>

                <!-- PROGRESS BAR -->
                <div class="progress-wrapper" id="progress-area">
                    <div class="progress-track">
                        <div class="progress-fill" id="progress-fill"></div>
                    </div>
                    <div class="progress-text" id="progress-text">0%</div>
                </div>
            </div>
        </div>

        <div class="status-text" id="status-text">Chào bạn! Cùng soi da nhé ✨</div>

        <button class="action-btn" id="scan-btn" onclick="startScan()">
            <span>✨ CHẠM ĐỂ SOI DA</span>
        </button>

        <div id="results-area">
            <div class="section-title">📝 Kết quả phân tích thật</div>

            <div class="score-card">
                <div class="score-info">
                    <h4>Độ sáng da (Tone)</h4>
                    <small id="tone-msg">Đang tính toán...</small>
                </div>
                <div class="score-circle" id="score-tone" style="--p: 0%;" data-val="--"></div>
            </div>

            <div class="score-card">
                <div class="score-info">
                    <h4>Vùng nhạy cảm/Đỏ</h4>
                    <small id="red-msg">Đang tính toán...</small>
                </div>
                <div class="score-circle" id="score-red" style="--p: 0%;" data-val="--"></div>
            </div>

            <div class="debug-info" id="debug-text">AI Raw Data: Waiting...</div>

            <div id="ai-suggestion" class="recommendation">
                <div class="rec-tag">💖 Đề xuất riêng cho bạn</div>
                <div id="rec-content">Đang tìm sản phẩm phù hợp...</div>
            </div>
        </div>
    </main>

    <script>
        const video = document.getElementById('camera-feed');
        const canvas = document.getElementById('scan-canvas');
        const ctx = canvas.getContext('2d');

        const scanLine = document.getElementById('scan-line');
        const statusText = document.getElementById('status-text');
        const btn = document.getElementById('scan-btn');
        const results = document.getElementById('results-area');
        const placeholder = document.getElementById('cam-placeholder');
        const debugText = document.getElementById('debug-text');

        const progressArea = document.getElementById('progress-area');
        const progressFill = document.getElementById('progress-fill');
        const progressText = document.getElementById('progress-text');

        // PRODUCT DATA 
        let productList = [];

        // 1. Start Camera
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    placeholder.style.display = 'none';
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                };
                fetch('products.json').then(r => r.json()).then(d => productList = d).catch(e => console.log('No JSON data'));
            } catch (err) {
                placeholder.innerHTML = "🚫 <span>Không bật được Camera!<br>Hãy kiểm tra quyền truy cập.</span>";
                statusText.innerText = "Lỗi Camera 🥺";
            }
        }

        // 2. AI PIXEL ANALYSIS ENGINE
        function analyzeFrame() {
            if (!video.videoWidth) return null;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = frame.data;
            const step = 20;

            let totalR = 0, totalG = 0, totalB = 0, count = 0;
            let rednessSum = 0;

            for (let i = 0; i < data.length; i += 4 * step) {
                const r = data[i], g = data[i + 1], b = data[i + 2];
                totalR += r; totalG += g; totalB += b;
                const brightness = (r + g + b) / 3;
                if (brightness > 20) {
                    rednessSum += (r - (g + b) / 2);
                }
                count++;
            }
            return { brightness: (totalR + totalG + totalB) / (3 * count), redness: rednessSum / count };
        }

        // 3. Scan Process
        function startScan() {
            btn.style.display = 'none';
            statusText.innerText = "⏳ Đang kết nối máy chủ AI...";
            scanLine.style.display = 'block';
            progressArea.style.display = 'block';

            let frames = 0, totalBright = 0, totalRed = 0;
            let percent = 0;

            const scanner = setInterval(() => {
                // Tăng % tiến trình
                percent += 3; // Chạy trong khoảng 3-4s
                if (percent > 100) percent = 100;

                progressFill.style.width = percent + "%";
                progressText.innerText = percent + "%";

                // Update trạng thái theo %
                if (percent < 30) statusText.innerText = "🔍 Đang quét từng điểm ảnh...";
                else if (percent < 60) statusText.innerText = "✨ Đang phân tích sắc tố da...";
                else if (percent < 90) statusText.innerText = "🤖 AI đang tổng hợp kết quả...";

                // Thu thập dữ liệu
                const metrics = analyzeFrame();
                if (metrics) {
                    totalBright += metrics.brightness;
                    totalRed += metrics.redness;
                    frames++;
                }

                if (percent >= 100) {
                    clearInterval(scanner);
                    const finalBright = frames > 0 ? totalBright / frames : 100;
                    const finalRed = frames > 0 ? totalRed / frames : 10;
                    setTimeout(() => finishScan(finalBright, finalRed), 500); // Delay xíu cho cảm giác
                }
            }, 100);
        }

        // 4. Display Results
        function finishScan(brightness, redness) {
            scanLine.style.display = 'none';
            progressArea.style.display = 'none'; // Ẩn thanh tiến trình
            statusText.innerText = "🎉 Đã có kết quả phân tích!";
            results.style.display = 'block';

            // 1. TONE DA
            const toneScore = Math.min(Math.round((brightness / 255) * 100), 100);
            document.getElementById('score-tone').style.setProperty('--p', `${toneScore}%`);
            document.getElementById('score-tone').setAttribute('data-val', `${toneScore}`);

            let toneMsg = "Da trung bình";
            if (toneScore < 30) toneMsg = "Da hơi tối màu / Thiếu sáng";
            else if (toneScore > 60) toneMsg = "Da sáng khỏe";
            document.getElementById('tone-msg').innerText = toneMsg;

            // 2. ĐỘ ĐỎ
            const redScorePercent = Math.min(Math.round((redness / 40) * 100), 100);
            document.getElementById('score-red').style.setProperty('--p', `${redScorePercent}%`);
            document.getElementById('score-red').setAttribute('data-val', `${Math.round(redness)}`);

            let redMsg = "Da ổn định";
            let skinIssue = "Normal";

            if (redness > 20) { redMsg = "Cảnh báo: Da ửng đỏ / Nhạy cảm"; skinIssue = "Sensitive"; }
            else if (redness > 30) { redMsg = "Cảnh báo: Có dấu hiệu viêm mụn"; skinIssue = "Acne"; }
            if (toneScore < 40 && skinIssue === "Normal") skinIssue = "Dry";

            document.getElementById('red-msg').innerText = redMsg;

            // 3. ĐỀ XUẤT
            let bestMatch = null;
            if (productList.length > 0) {
                bestMatch = productList.find(p => p.skinType.includes(skinIssue)) || productList[0];
            } else {
                bestMatch = {
                    name: "Bộ phục hồi da B5",
                    advice: "Da bạn đang cần phục hồi gấp, B5 là chân ái!",
                    link: "https://www.tiktok.com/@cuongvqart",
                    image: "https://source.unsplash.com/random/100x100/?skincare"
                };
            }

            const cleanLink = bestMatch.link || bestMatch.original_link || "#";

            document.getElementById('rec-content').innerHTML = `
                <img src="${bestMatch.image || 'https://via.placeholder.com/100'}" class="rec-img">
                <h3 style="color:#ff6b6b; font-size:1.1rem; margin-bottom:5px;">${bestMatch.name}</h3>
                <p style="font-size:0.9rem; font-style:italic; color:#888; margin-bottom:10px;">phát hiện <b>${skinIssue}</b>: "${bestMatch.advice || 'Sản phẩm này cực tốt cho da của bạn'}"</p>
                <a href="${cleanLink}" target="_blank" class="buy-btn">MUA NGAY TRÊN TIKTOK</a>
            `;

            results.scrollIntoView({ behavior: 'smooth' });
        }

        initCamera();
    </script>
</body>

</html>
